<!--
RETO: Crea tu propio perfil web.
Instrucciones:
1. Cambia el nombre, la foto y la descripción para que sean sobre ti.
2. Agrega un enlace a tu red social favorita (puedes usar Instagram, Facebook, TikTok, etc).
3. Opcional: agrega una segunda sección igual para un amigo o familiar.

¡No borres los comentarios! Te ayudarán a recordar qué hace cada parte del código.
-->

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Mi Reto: Perfil Web</title>
  <link rel="stylesheet" href="reto-perfil.css">
</head>
<body>
  <!-- Sección de perfil principal -->
  <div class="perfil">
    <!-- Cambia la imagen por una tuya o de alguien que admires -->
    <img src="https://randomuser.me/api/portraits/women/68.jpg" alt="Foto de perfil">
    <!-- Cambia el nombre por el tuyo -->
    <h2>María Gómez</h2>
    <!-- Escribe una breve descripción sobre ti -->
    <p>¡Hola! Soy estudiante de secundaria y me gusta la música y la tecnología.</p>
    <!-- Cambia el enlace para que apunte a tu red social favorita -->
    <a href="https://www.instagram.com/" target="_blank">Sígueme en Instagram</a>
  </div>
